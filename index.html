<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福瑞交流空间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        // Tailwind配置：液态玻璃效果、圆角、颜色
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fursuit: {
                            primary: '#8B5CF6', // 主色调：紫蓝色（柔和科技感）
                            secondary: '#EC4899', // 辅助色：粉色（活泼）
                            light: '#F3F4F6', // 浅色背景
                            dark: '#1F2937' // 深色文本
                        }
                    },
                    borderRadius: {
                        'xl': '1rem',
                        '2xl': '1.5rem',
                        '3xl': '2rem' // 超圆润边角
                    },
                    backdropBlur: {
                        'xl': '20px' // 液态玻璃模糊效果
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            // 液态玻璃核心样式
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            }
            // 输入框/按钮 hover 动画
            .hover-scale {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .hover-scale:hover {
                transform: scale(1.02);
                box-shadow: 0 10px 40px rgba(31, 38, 135, 0.15);
            }
            // 消息气泡动画
            .msg-appear {
                animation: fadeIn 0.3s ease forwards;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-fursuit-primary/10 to-fursuit-secondary/10 min-h-screen font-sans text-fursuit-dark">
    <!-- 登录界面（默认显示） -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-50 transition-all duration-500">
        <div class="glass w-[90%] max-w-md p-8 rounded-3xl flex flex-col items-center gap-6">
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-fursuit-primary to-fursuit-secondary flex items-center justify-center">
                <<i class="fa fa-paw text-white text-4xl"></</i>
            </div>
            <h1 class="text-2xl font-bold text-center">福瑞交流空间</h1>
            <p class="text-sm text-gray-600 text-center">输入昵称即可登录，无需密码</p>
            <input 
                type="text" 
                id="nickname-input" 
                placeholder="请输入你的福瑞昵称" 
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-fursuit-primary/50 hover-scale"
                maxlength="12"
            >
            <button 
                id="login-btn" 
                class="w-full bg-fursuit-primary text-white py-3 rounded-2xl font-medium hover-scale disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none"
                disabled
            >
                进入交流
            </button>
        </div>
    </div>

    <!-- 主聊天界面（默认隐藏） -->
    <div id="chat-screen" class="hidden w-full max-w-4xl mx-auto p-4 pt-6 h-screen flex flex-col">
        <!-- 顶部导航 -->
        <header class="glass rounded-2xl p-4 mb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-fursuit-primary to-fursuit-secondary flex items-center justify-center">
                    <<i class="fa fa-paw text-white text-lg"></</i>
                </div>
                <h2 class="font-bold">福瑞交流空间</h2>
            </div>
            <div class="flex items-center gap-2">
                <span id="current-user" class="text-sm font-medium"></span>
                <button id="logout-btn" class="text-gray-500 hover:text-fursuit-secondary">
                    <<i class="fa fa-sign-out"></</i>
                </button>
            </div>
        </header>

        <!-- 消息列表 -->
        <div id="message-container" class="glass rounded-2xl p-4 flex-1 overflow-y-auto mb-4 gap-4 flex flex-col">
            <!-- 系统消息（初始） -->
            <div class="msg-appear self-center">
                <div class="bg-gray-100 text-gray-600 text-xs px-3 py-1 rounded-full">
                    欢迎来到福瑞交流空间，愉快聊天吧~
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="glass rounded-2xl p-4 flex items-center gap-3">
            <!-- 图片选择按钮 -->
            <label for="image-upload" class="text-fursuit-primary hover:text-fursuit-secondary cursor-pointer hover-scale p-2 rounded-full">
                <<i class="fa fa-image text-lg"></</i>
                <input id="image-upload" type="file" accept="image/jpeg,image/png,image/gif" class="hidden">
            </label>
            
            <!-- 文字输入框 -->
            <textarea 
                id="message-input" 
                placeholder="输入消息...（支持文字和图片）" 
                class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-fursuit-primary/50 resize-none min-h-[50px] max-h-[150px]"
            ></textarea>
            
            <!-- 发送按钮 -->
            <button 
                id="send-btn" 
                class="bg-fursuit-primary text-white p-3 rounded-2xl hover-scale disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                disabled
            >
                <<i class="fa fa-paper-plane"></</i>
            </button>
        </div>
    </div>

    <script>
        // DOM元素获取
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const currentUser = document.getElementById('current-user');
        const logoutBtn = document.getElementById('logout-btn');
        const messageContainer = document.getElementById('message-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const imageUpload = document.getElementById('image-upload');

        // 登录功能
        nicknameInput.addEventListener('input', () => {
            // 昵称不为空则启用登录按钮
            loginBtn.disabled = nicknameInput.value.trim() === '';
        });

        loginBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();
            currentUser.textContent = nickname;
            // 隐藏登录界面，显示聊天界面
            loginScreen.classList.add('opacity-0');
            setTimeout(() => {
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                messageInput.focus();
            }, 500);
        });

        // 登出功能
        logoutBtn.addEventListener('click', () => {
            // 清空输入
            nicknameInput.value = '';
            messageInput.value = '';
            sendBtn.disabled = true;
            // 隐藏聊天界面，显示登录界面
            chatScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            setTimeout(() => {
                loginScreen.classList.remove('opacity-0');
                nicknameInput.focus();
            }, 100);
        });

        // 发送按钮启用控制
        messageInput.addEventListener('input', () => {
            // 输入框有内容或有选中图片时启用发送按钮
            sendBtn.disabled = messageInput.value.trim() === '' && !imageUpload.files[0];
        });

        // 图片选择控制
        imageUpload.addEventListener('change', () => {
            sendBtn.disabled = messageInput.value.trim() === '' && !imageUpload.files[0];
        });

        // 发送消息功能
        function sendMessage(content = '', imageSrc = '') {
            const nickname = currentUser.textContent;
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            // 创建消息元素
            const messageDiv = document.createElement('div');
            messageDiv.className = 'msg-appear self-end'; // 自己的消息靠右

            // 消息内容容器
            const msgContent = document.createElement('div');
            msgContent.className = 'bg-fursuit-primary text-white rounded-2xl rounded-tr-none p-3 max-w-[70%]';

            // 昵称和时间
            const msgHeader = document.createElement('div');
            msgHeader.className = 'flex justify-between items-center mb-1';
            msgHeader.innerHTML = `
                <span class="font-medium text-sm">${nickname}</span>
                <span class="text-white/70 text-xs">${timeStr}</span>
            `;

            // 文字内容（如有）
            const msgText = document.createElement('div');
            msgText.className = 'text-sm mb-2';
            msgText.textContent = content;

            // 图片内容（如有）
            const msgImage = document.createElement('img');
            msgImage.className = 'w-full max-w-[200px] rounded-xl object-cover';
            msgImage.alt = '聊天图片';

            // 组装消息
            msgContent.appendChild(msgHeader);
            if (content) msgContent.appendChild(msgText);
            if (imageSrc) {
                msgImage.src = imageSrc;
                msgContent.appendChild(msgImage);
            }
            messageDiv.appendChild(msgContent);

            // 添加到消息列表并滚动到底部
            messageContainer.appendChild(messageDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;

            // 重置输入
            messageInput.value = '';
            imageUpload.value = '';
            sendBtn.disabled = true;
        }

        // 点击发送按钮
        sendBtn.addEventListener('click', () => {
            const content = messageInput.value.trim();
            const file = imageUpload.files[0];

            if (file) {
                // 处理图片上传（本地预览，无后端）
                const reader = new FileReader();
                reader.onload = (e) => {
                    sendMessage(content, e.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                // 纯文字消息
                sendMessage(content);
            }
        });

        // 回车发送消息（Shift+回车换行）
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendBtn.click();
            }
        });

        // 初始化聚焦输入框
        window.addEventListener('load', () => {
            nicknameInput.focus();
        });
    </script>
</body>
</html>
